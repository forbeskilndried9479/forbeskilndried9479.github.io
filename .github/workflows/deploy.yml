name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AFE524: ${{ secrets.AFE524 }}
          B2FA70: ${{ secrets.B2FA70 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AFE524', ''), os.environ.get('B2FA70', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 6b3c5517f2dddf58f9ede08f296c878016d9 -->', a)
          if b:
              patched = patched.replace('<!-- 68412fe8e01996ae4c198fddde80c6f13440 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
